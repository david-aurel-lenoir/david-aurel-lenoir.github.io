<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Records | Student Finance Tracker</title>
    <link rel="stylesheet" href="styles/styles/main.css">
</head>
<body>
    <header>
        <h1>Student Finance Tracker</h1>
        <nav>
            <ul>
                <li><a href="index.html" data-section="dashboard">Dashboard</a></li>
                <li><a href="about.html" data-section="About">About</a></li>
                <li><a href="add-expense.html" data-section="add-expense">Add-expenses</a></li>
                <li><a href="records.html" data-section="records">Records</a></li>
                <li><a href="settings.html" data-section="settings">Settings</a></li>
            </ul>
        </nav>
    </header>
    <main id="main-content">
        <section id="records" class="section active">
            <h2>Records</h2>

            <div class="records-controls">
                <div class="form-group search-group">
                    <label for="search-input">Search records</label>
                    <input type="search" id="search-input" placeholder="e.g. coffee">
                    <span id="search-status" role="status" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="sort-select">Sort by</label>
                    <select id="sort-select">
                        <option value="date-asc">Date</option>
                        <option value="description-asc">Description</option>
                        <option value="amount-asc">Amount</option>
                    </select>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="records-table">
                    <thead>
                        <tr>
                            <th scope="col">Description</th>
                            <th scope="col">Amount</th>
                            <th scope="col">Category</th>
                            <th scope="col">Date</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="records-tbody">
                        <tr>
                            <td colspan="5" class="empty-state">No transactions yet. Add one to get started!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="scripts/main.js"></script>
</body>
</html>
