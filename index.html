<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>     Students Finance Tracker</title>
    <link rel="stylesheet" href="styles/styles/main.css">
</head> 
<body>
        <a href="#main-content" class="skip-link"> Go to main content</a>
        <header>
            <h1>Student Finance Tracker</h1>
            <nav>
                <ul>
                    <li><a href="about.html" data-section="About">About</a></li>
                    <li><a href="index.html" data-section="dashboard">Dashboard</a></li>
                    <li><a href="add-expense.html" data-section="add-expense">Add-expenses</a></li>
                    <li><a href="records.html" data-section="records">Records</a></li>
                    <li><a href="settings.html" data-section="settings">Settings</a></li>
                </ul>
            </nav>
        </header>
        <main id="main-content">
            <section id="dashboard" class="section active">
                <h2>Dashboard</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Expenses</h3>
                        <p class="stat-value" id="stat-total"> 0 RWF</p>
                    </div>
                    <div class="stat-card">
                        <h3>Number of expenses</h3>
                        <p class="stat-value" id="stat-count">0</p>
                        
                </div>
                <div class="stat-card">
                    <h3>Top Category</h3>
                    <p class="stat-value" id="stat-top-category">None</p>   
                </div>
                </div>
                <div class="budget-indicator">
                    <h3>Budget Indicator</h3>
                    <p id="budget-status" role="status" aria-live="polite">No budget set</p>
                <div class="progress-bar">
                    <div class="progress" id="budget-progress"></div>
                </div>
                </div>
            <div class="chart-container">
                <h3> last 7 days     </h3>
                <div class="chart" id="chart-bars"> </div>
            </div>
            </section>
        </main>
        <footer>
        <p>© ALU October 2026 David Aurelien Bitwayiki</p>
    </footer>
        <script src="scripts/main.js"></script>
        </body>
</html>
