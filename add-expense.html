<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense | Student Finance Tracker</title>
    <link rel="stylesheet" href="styles/styles/main.css">
</head>
<body>
    <header>
        <h1>Student Finance Tracker</h1>
        <nav>
            <ul>
                <li><a href="index.html" data-section="dashboard">Dashboard</a></li>
                <li><a href="about.html" data-section="About">About</a></li>
                <li><a href="add-expense.html" data-section="add-expense">Add-expenses</a></li>
                <li><a href="records.html" data-section="records">Records</a></li>
                <li><a href="settings.html" data-section="settings">Settings</a></li>
            </ul>
        </nav>
    </header>
    <main id="main-content">
        <section id="add" class="section active">
            <h2 id="form-h">Add Transaction</h2>
            <p role="status" aria-live="polite"></p>
            <form id="tx-form" novalidate>
                <input id="transaction-id" type="hidden">
                <label for="description">Description</label>
                <input id="description" type="text" name="description" required>
                <span class="error" id="description-error" role="alert"></span>

                <label for="amount">Amount (RWF)</label>
                <input id="amount" type="text" inputmode="decimal" name="amount" required>
                <span class="error" id="amount-error" role="alert"></span>

                <label for="category">Category</label>
                <input id="category" type="text" list="cats" name="category" required>
                <datalist id="cats"></datalist>
                <span class="error" id="category-error" role="alert"></span>

                <label for="date">Date (yyyy-mm-dd)</label>
                <input id="date" type="date" name="date" required>
                <span class="error" id="date-error" role="alert"></span>

                <div class="form-group">
                    <button type="submit">Save Transaction</button>
                    <button type="button" class="secondary" id="cancel-btn">Cancel</button>
                </div>
                <p id="form-status" class="status" role="status"></p>
            </form>
        </section>
    </main>
    <script src="scripts/main.js"></script>
</body>
</html>
